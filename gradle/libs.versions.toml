[versions]
agp = "9.2.1"
python = "17.0.0"
minSdk = "24"
targetSdk = "34"
compileSdk = "34"

# ===== AndroidX 與 官方核心組件 (必須對齊 SDK 34) =====
annotation = "1.8.2"           # 降級：1.10.x 要求 SDK 35
appcompat = "1.7.0"            # 降級：1.7.1 依賴 SDK 35 編譯
biometric = "1.1.0"
desugar = "2.1.5"              # 調整：與 Android 14 工具鏈更穩定的核心脫糖版本
leanback = "1.0.0"             # 降級：1.2.0 在 SDK 34 下可能觸發焦點渲染 Bug
lifecycleService = "2.8.4"     # 降級：2.11.0 包含大量 Android 15 新生命週期 API
palette = "1.0.0"
preference = "1.2.1"
recyclerview = "1.3.2"         # 降級：1.4.0 含有 SDK 35 特殊滾動動畫要求
room = "2.6.1"                 # 關鍵降級：2.8.x 強制要求 SDK 35，2.6.1 是 SDK 34 的黃金穩定版
splashscreen = "1.0.1"         # 降級：1.2.0 要求高版本編譯環境
startup = "1.1.1"              # 降級：1.2.0 包含 SDK 35 優化
swiperefreshlayout = "1.1.0"    # 降級：1.2.0 包含不相容依賴
viewpager2 = "1.1.0"

# ===== 第三方工具與影音模組 (降至相容 SDK 34 且不影響功能的最高版本) =====
androidGifDrawable = "1.2.32"
androidautosize = "1.2.1"
brotli = "0.1.2"
customactivityoncrash = "2.4.0"
flexbox = "3.0.0"
glide = "4.16.0"               # 關鍵降級：您原本的 5.0.7 Alpha 容易與新版 Media3 的數據模型衝突，4.16 是極穩定的老將
greenrobot = "3.3.1"
gson = "2.10.1"                # 降級：2.14 包含 JVM 高版本特性，電視盒 2.10 最安全
guava = "33.2.1-android"       # 降級：33.6 要求更高環境
jna = "5.14.0"                 # 降級：5.19 某些 native 庫會觸發 16KB 對齊警告
jupnp = "3.0.4"                # 保持不變：完全相容 SDK 34，這也是您需要的最新 DLNA 引擎
juniversalchardet = "1.0.3"
logger = "2.2.0"
lottie = "6.4.1"               # 降級：6.7 內部包含部分高版本渲染 API
material = "1.12.0"            # 關鍵降級：1.14.0 內部大量引用 SDK 35 資源，1.12 是 SDK 34 的上限
materialdesigncolors = "1.0.0"
nanohttpd = "2.3.1"            # 保持不變：您的本地 Proxy 廣告過濾核心，在 34 完美運作
newpipeextractor = "v0.26.3"
okhttp = "4.12.0"              # 關鍵降級：5.0.0 在 SDK 34 環境下某些 API 存在 runtime 閃退隱患，4.12 在 Android 14 兼容性最佳
permissionx = "1.8.0"          # 降級：1.8.1 引入了部分 Android 15 權限行為
quickjs = "3.2.3"
rtmpClient = "v3.2.0.m2"
sardine = "0.9"
smbj = "0.13.0"                # 降級：0.14 在某些舊電視盒的 SMB 協定解析上有 bug
textdrawable = "1.0.3"
tikxml = "0.8.13"
zxingAndroidEmbedded = "4.3.0"
zxingCore = "3.5.3"            # 降級：3.5.4 要求高版本環境

# ===== 核心影音解碼 (Media3 世代對齊) =====
media3 = "1.4.1"               # 降級：對齊 Android 34 的穩定版本



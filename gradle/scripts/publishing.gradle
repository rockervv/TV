import groovy.json.JsonOutput
import groovy.json.JsonSlurper

androidComponents {
    onVariants(selector().all()) { variant ->
        def buildType = variant.buildType
        def variantName = variant.name

        // 1. 處理基本 Outputs 檔名與版本號設定
        variant.outputs.each { output ->
            def flavorNames = variant.productFlavors.collect { it.second }
            def flavorFileName = flavorNames.join("-")

            output.outputFileName.set("leanback-${flavorFileName}-${buildType}.apk")
            if (buildType == 'release') {
                output.versionName.set(project.autoVersionName)
                output.versionCode.set(project.autoVersionCode.toInteger())
            }
        }

        // 2. 僅在 Release 模式時執行複製與生成 JSON 的邏輯
        if (buildType == 'release') {
            def flavorNames = variant.productFlavors.collect { it.second }
            def flavorDirName = flavorNames.join("")
            def flavorFileName = flavorNames.join("-")
            def rootOutputDir = file("${project.projectDir}/release_output")
            def targetOutputDir = file("${rootOutputDir}/${flavorDirName}")
            def masterJsonFile = new File(rootOutputDir, "leanback.json")
            
            // 🛡️ 需求：x86_64 自動觸發 armeabi_v7a 的編譯
            if (variant.flavorName.toLowerCase().contains("x86_64")) {
                def otherVariantName = variant.name.replace("X86_64", "Armeabi_v7a")
                tasks.matching { it.name == "assemble${variantName.capitalize()}" }.configureEach {
                    it.dependsOn("assemble${otherVariantName.capitalize()}")
                }
            }

            // 動態計算目標 Task 的名字
            def targetTaskName = "assemble${variantName.substring(0, 1).toUpperCase()}${variantName.substring(1)}"
            def apkDirProvider = variant.artifacts.get(project.apkArtifact)

            tasks.configureEach { task ->
                if (task.name == targetTaskName) {
                    task.doLast {
                        def commitMessage = project.getLastCommitMessage()
                        def apkDir = apkDirProvider.get().asFile
                        def apkFile = new File(apkDir, variant.outputs.first().outputFileName.get())

                        // 計算 APK 的 MD5
                        def md5 = ""
                        if (apkFile.exists()) {
                            def messageDigest = java.security.MessageDigest.getInstance("MD5")
                            apkFile.eachByte(4096) { buffer, length ->
                                messageDigest.update(buffer, 0, length)
                            }
                            md5 = new BigInteger(1, messageDigest.digest()).toString(16).padLeft(32, '0')
                        }

                        // 🛡️ 執行合併 JSON 邏輯
                        // 使用專案級別的鎖確保多個 assemble 任務併發執行時不會寫壞 JSON
                        project.rootProject.ext.with {
                            if (!delegate.hasProperty("jsonLock")) delegate.jsonLock = new Object()
                        }
                        
                        synchronized(project.rootProject.ext.jsonLock) {
                            def jsonSlurper = new JsonSlurper()
                            def data = [:]
                            if (masterJsonFile.exists()) {
                                try {
                                    data = jsonSlurper.parse(masterJsonFile)
                                } catch (Exception ignored) {}
                            }

                            // 更新基本資訊
                            data.name = project.autoVersionName
                            data.code = project.autoVersionCode.toInteger()
                            data.desc = commitMessage
                            data.md5 = md5

                            // 初始化或更新 apks 列表
                            if (data.apks == null) data.apks = []
                            
                            def currentFlavorKey = "leanback-${flavorFileName}"
                            def existingApk = data.apks.find { it.flavor == currentFlavorKey }
                            if (existingApk) {
                                existingApk.md5 = md5
                            } else {
                                data.apks << [
                                    name: "${flavorFileName} 版本",
                                    flavor: currentFlavorKey,
                                    md5: md5
                                ]
                            }

                            rootOutputDir.mkdirs()
                            masterJsonFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(data))
                        }

                        // 將編譯好的 APK 複製到指定的 release_output 目錄下
                        targetOutputDir.mkdirs()
                        variant.outputs.each { output ->
                            project.copy {
                                from new File(apkDir, output.outputFileName.get())
                                into targetOutputDir
                            }
                        }
                        
                        // 同時複製主 JSON 到每個 flavor 目錄下（相容舊機制）
                        project.copy {
                            from masterJsonFile
                            into targetOutputDir
                        }
                    }
                }
            }
        }
    }
}
